<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solara Bay — an original open-world crime game: steal cars, run missions, outrun the police.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffd76a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e85d75'/%3E%3C/svg%3E">
<title>Solara Bay — Open World Crime</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b0e14; font-family: "Segoe UI", system-ui, sans-serif;
  }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #fallback {
    position: fixed; inset: 0; display: none; place-items: center;
    color: #e8e4d8; background: #0b0e14; text-align: center; padding: 24px;
    font-size: 18px; line-height: 1.5;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="800"></canvas></div>
<div id="fallback">Solara Bay needs JavaScript and a modern desktop browser to run.</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
